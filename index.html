<title>Meu Budget ✦</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#171717;--muted:#85857f;--line:#e8e8e2;--green:#17784c;--red:#b84242;--purple:#6859d8;--amber:#b97918}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:760px;margin:auto;padding:22px 18px 105px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:28px;font-weight:850;letter-spacing:-1.2px}.month{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:4px}.month button{background:none;width:30px;height:30px;border-radius:10px;font-size:20px;color:#555}.month b{font-size:12px;text-transform:capitalize;min-width:105px;text-align:center}
.hero{background:#171717;color:#fff;border-radius:30px;padding:25px 22px 20px;box-shadow:0 18px 45px #00000012}.eyebrow{text-transform:uppercase;letter-spacing:1.3px;font-size:10px;font-weight:750;color:#aaa}.hero h1{font-size:42px;line-height:1;margin:9px 0 7px;letter-spacing:-2px}.hero p{margin:0;color:#bcbcb8;font-size:12px}.bar{display:flex;height:10px;background:#353533;border-radius:20px;overflow:hidden;margin-top:23px}.bar .spend{background:#f2f2ed}.bar .save{background:#8b7ff0}.legend{display:flex;justify-content:space-between;color:#aaa;font-size:10px;margin-top:8px}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:19px}.mini{background:#ffffff0e;border-radius:15px;padding:10px}.mini span{font-size:9px;color:#aaa}.mini b{display:block;font-size:14px;margin-top:4px}
.label{margin:23px 2px 9px;font-size:10px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 6px 24px #00000008}.real{min-height:125px}.real span{font-size:11px;color:var(--muted)}.real strong{display:block;font-size:24px;letter-spacing:-.8px;margin-top:8px}.real small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.purple{color:var(--purple)}
.badge{display:inline-block;border-radius:9px;padding:5px 7px;font-size:9px;font-weight:800;margin-top:8px;background:#eeeafd;color:var(--purple)}
.section{background:#fff;border:1px solid var(--line);border-radius:23px;padding:18px;margin-top:10px;box-shadow:0 6px 24px #00000008}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section h2{font-size:16px;margin:0;letter-spacing:-.4px}.link{background:none;color:#777;font-size:11px;font-weight:700}
.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #efefea}.row:last-child{border-bottom:0}.icon{width:40px;height:40px;border-radius:13px;background:#f0f0ec;display:grid;place-items:center;font-size:17px;flex:none}.main{min-width:0;flex:1}.name{font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:3px}.amount{font-size:12px;font-weight:800}.out{color:var(--red)}.in{color:var(--green)}
.prow{padding:11px 0;border-bottom:1px solid #efefea}.prow:last-child{border:0}.pt{display:flex;justify-content:space-between;font-size:11px}.pt span{color:var(--muted)}.prog{height:7px;background:#ededeb;border-radius:20px;overflow:hidden;margin-top:7px}.prog i{display:block;height:100%;background:#222;border-radius:20px}.prog.warn i{background:var(--amber)}.prog.over i{background:var(--red)}
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:#f7f7f5e8;backdrop-filter:blur(18px);border-top:1px solid #0000000c;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;color:#92928c;font-size:9px;font-weight:700;padding:5px;border-radius:13px}.nav button.active{color:#171717}.nav .ico{display:block;font-size:19px;line-height:20px;margin-bottom:2px}
.fab{position:fixed;right:max(22px,calc((100vw - 760px)/2 + 18px));bottom:82px;width:51px;height:51px;border-radius:18px;background:#171717;color:#fff;font-size:27px;z-index:15;box-shadow:0 13px 30px #0003}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.pagehead h1{font-size:26px;margin:0;letter-spacing:-1px}.primary,.secondary,.danger{padding:10px 13px;border-radius:13px;font-size:11px;font-weight:800}.primary{background:#171717;color:#fff}.secondary{background:#efefeb;color:#171717}.danger{background:#f8e8e7;color:#9f3434}
.form{display:grid;gap:11px}.field label{display:block;font-size:10px;color:var(--muted);font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:0}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
.copy{background:#eeeafd;border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.copy b{font-size:12px}.copy span{display:block;color:#665da4;font-size:10px;margin-top:3px}
.modalback{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:50;padding:10px}.modalback.show{display:flex}.modal{background:#fff;width:min(580px,100%);max-height:90vh;overflow:auto;border-radius:27px;padding:19px}.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.mhead h2{font-size:18px;margin:0}.close{width:33px;height:33px;border-radius:11px;background:#f0f0ec;font-size:20px}.empty{text-align:center;padding:24px;color:var(--muted);font-size:12px}.catrow{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #efefea}.catrow:last-child{border:0}.catrow .main{font-size:12px;font-weight:750}.toast{position:fixed;z-index:60;bottom:82px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:10px 14px;border-radius:13px;font-size:11px;display:none}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.real{min-height:135px}}
</style>

<style id="vibrant-redesign">
:root{
 --bg:#f4f5fb;--card:#ffffff;--ink:#17162b;--muted:#77758b;--line:#e8e7f0;
 --green:#10a36b;--red:#e4515b;--purple:#7657e8;--amber:#f0a63b;
}
body{background:linear-gradient(180deg,#f7f5ff 0,#f4f5fb 42%,#f7f8fb 100%);color:var(--ink)}
.wrap{max-width:820px;padding:20px 18px 112px}
header{margin-bottom:22px}.brand{font-size:29px;letter-spacing:-1.5px;background:linear-gradient(90deg,#17162b 0,#7657e8 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.month{box-shadow:0 6px 22px rgba(60,45,120,.08);border-color:#e4e1f2}
.month button:hover{background:#f1effc;color:#7657e8}

 background:linear-gradient(135deg,#19172d 0%,#33276d 52%,#7657e8 100%);

.bar{background:#ffffff24;height:11px}.bar .spend{background:#fff}.bar .save{background:#b8aaff}
.legend{color:#d2cfe1}.hero-grid{gap:9px}.mini{background:#ffffff13;border:1px solid #ffffff12}.mini span{color:#c8c5d4}
.label{color:#77758b;letter-spacing:1.3px;margin-top:26px}
.card,.section{
 border-color:#e9e7f1;border-radius:24px;

.real:nth-child(1){border-top:3px solid #10a36b}.real:nth-child(2){border-top:3px solid #e4515b}
.real:nth-child(3){border-top:3px solid #7657e8}.real:nth-child(4){border-top:3px solid #f0a63b}
.icon{background:linear-gradient(135deg,#f0edff,#e8f4ff);color:#6753d4}
.row{padding:13px 0}.name{font-size:13px}.amount{font-size:13px}
.prog{height:8px;background:#eeeef5}.prog i{background:linear-gradient(90deg,#7657e8,#9a83ff)}
.prog.warn i{background:linear-gradient(90deg,#f0a63b,#f5c76e)}
.prog.over i{background:linear-gradient(90deg,#e4515b,#f17c84)}

.nav button.active .ico{background:#eeeafd;border-radius:12px;padding:2px 9px;margin-left:auto;margin-right:auto;width:max-content}
.pagehead h1{font-size:28px}.pagehead{margin-bottom:17px}
.modal{border-radius:30px}.close{background:#f0eff6}
.field input:focus,.field select:focus{border-color:#a99bf0;box-shadow:0 0 0 3px #7657e814}

<body>
<div id="app"></div><div id="mb" class="modalback"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const KEY="financas_v2";
const defaults={transactions:[],budgets:{},monthlyIncome:{},accounts:[],categories:["Casa","Alimentação","Transporte","Lazer","Saúde","Pessoal","Compras","Educação","Assinaturas","Outros"],incomeCategories:["Salário","Bônus","Freelance","Rendimentos","Reembolso","Outros"],methods:["Pix","Débito","Crédito","Dinheiro","Transferência"],page:"dashboard"};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;
for(const k of ["transactions","budgets","monthlyIncome","categories","incomeCategories","methods"])if(db[k]==null)db[k]=defaults[k];
if(!db.accounts)db.accounts=[];if(!db.accounts.length)db.accounts=[{id:crypto.randomUUID(),name:"Conta principal",type:"Conta",balance:0}];
let cur=new Date(db.date||Date.now()),editId=null,editAcc=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const ym=()=>cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0");
const ml=()=>cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
const save=()=>{db.date=cur.toISOString();localStorage.setItem(KEY,JSON.stringify(db))};
function totals(){let a=db.transactions.filter(t=>String(t.date).slice(0,7)===ym()),i=a.filter(t=>t.type==="income").reduce((s,t)=>s+Number(t.amount),0),e=a.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount),0);return{income:i,expense:e,result:i-e}}
function plan(){let i=Number(db.monthlyIncome[ym()]||0),g=db.categories.reduce((s,c)=>s+Number(db.budgets[ym()+"|"+c]||0),0);return{income:i,spend:g,save:i-g}}
function header(){return `<header><div class="brand">Meu Budget</div><div class="month"><button onclick="chg(-1)">‹</button><b>${ml()}</b><button onclick="chg(1)">›</button></div></header>`}
function chg(n){cur.setMonth(cur.getMonth()+n);save();render()}function page(p){db.page=p;save();render()}
function nav(){let a=[["dashboard","⌂","Início"],["transactions","↕","Lançamentos"],["budget","◒","Planejamento"],["accounts","▣","Contas"],["config","⚙","Ajustes"]];return `<nav class="nav"><div class="navin">${a.map(x=>`<button class="${db.page===x[0]?"active":""}" onclick="page('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join("")}</div></nav>`}
function dashboard(){let p=plan(),t=totals(),pp=p.income?Math.max(0,Math.min(100,p.spend/p.income*100)):0,rp=t.income?t.result/t.income*100:0,d=t.result-p.save;let recent=[...db.transactions].filter(x=>String(x.date).slice(0,7)===ym()).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${header()}<section class="hero"><div class="eyebrow">Economia planejada</div><h1>${money(p.save)}</h1><p>${p.income?"Do total de "+money(p.income)+" planejado para o mês":"Defina sua receita e seus limites no Planejamento"}</p><div class="bar"><div class="spend" style="width:${pp}%"></div><div class="save" style="width:${Math.max(0,100-pp)}%"></div></div><div class="legend"><span>Gastos ${money(p.spend)}</span><span>Economia ${money(p.save)}</span></div><div class="hero-grid"><div class="mini"><span>Receita</span><b>${money(p.income)}</b></div><div class="mini"><span>Gastos</span><b>${money(p.spend)}</b></div><div class="mini"><span>Guardar</span><b>${money(p.save)}</b></div></div></section><div class="label">Realizado</div><div class="grid"><div class="card real"><span>Receitas</span><strong class="green">${money(t.income)}</strong><small>Entrou no mês</small></div><div class="card real"><span>Despesas</span><strong class="red">${money(t.expense)}</strong><small>Saiu no mês</small></div><div class="card real"><span>Economia real</span><strong class="${t.result>=0?"green":"red"}">${money(t.result)}</strong><small>Receitas − despesas</small><em class="badge">${d>=0?"+":"−"}${money(Math.abs(d))} vs. plano</em></div><div class="card real"><span>Taxa de economia</span><strong class="purple">${isFinite(rp)?rp.toFixed(0):0}%</strong><small>Da renda realizada</small></div></div><div class="label">Orçamento</div><div class="section">${budgetRows(5)}<div style="text-align:right;margin-top:6px"><button class="link" onclick="page('budget')">Ver tudo →</button></div></div><div class="label">Últimos lançamentos</div><div class="section">${recent.length?recent.map(tx).join(""):'<div class="empty">Nenhum lançamento neste mês.</div>'}</div><button class="fab" onclick="openTx()">+</button>`}
function tx(t){return `<div class="row"><div class="icon">${t.type==="income"?"↗":"↘"}</div><div class="main"><div class="name">${esc(t.description||t.category)}</div><div class="meta">${esc(t.category)} · ${new Date(t.date+"T12:00").toLocaleDateString("pt-BR")}</div></div><div class="amount ${t.type==="income"?"in":"out"}">${t.type==="income"?"+":"−"}${money(t.amount)}</div></div>`}
function budgetRows(limit=99){let m=ym(),r=db.categories.map(c=>{let l=Number(db.budgets[m+"|"+c]||0),s=db.transactions.filter(t=>String(t.date).slice(0,7)===m&&t.type==="expense"&&t.category===c).reduce((a,t)=>a+Number(t.amount),0);return{c,l,s}}).filter(x=>x.l||x.s).slice(0,limit);if(!r.length)return'<div class="empty">Nenhum limite definido ainda.</div>';return r.map(x=>{let q=x.l?x.s/x.l*100:0;return`<div class="prow"><div class="pt"><b>${esc(x.c)}</b><span>${money(x.s)} / ${money(x.l)} · ${x.l?q.toFixed(0)+"%":"—"}</span></div><div class="prog ${q>=100?"over":q>=80?"warn":""}"><i style="width:${Math.min(100,q)}%"></i></div></div>`}).join("")}
function transactions(){let a=[...db.transactions].filter(t=>String(t.date).slice(0,7)===ym()).sort((x,y)=>y.date.localeCompare(x.date));return `${header()}<div class="pagehead"><h1>Lançamentos</h1><button class="primary" onclick="openTx()">+ Adicionar</button></div><div class="section">${a.length?a.map(t=>`<div class="row"><div class="icon">${t.type==="income"?"↗":"↘"}</div><div class="main"><div class="name">${esc(t.description||t.category)}</div><div class="meta">${esc(t.category)} · ${esc(t.account||"Sem conta")} · ${new Date(t.date+"T12:00").toLocaleDateString("pt-BR")}</div></div><div><div class="amount ${t.type==="income"?"in":"out"}">${t.type==="income"?"+":"−"}${money(t.amount)}</div><div class="actions"><button class="secondary" onclick="openTx('${t.id}')">Editar</button><button class="danger" onclick="delTx('${t.id}')">Excluir</button></div></div></div>`).join(""):'<div class="empty">Nenhum lançamento neste mês.</div>'}</div><button class="fab" onclick="openTx()">+</button>`}
function budget(){let p=plan(),t=totals(),q=p.income?p.spend/p.income*100:0;return`${header()}<div class="pagehead"><h1>Planejamento</h1><button class="primary" onclick="openBudget()">Editar</button></div><div class="card"><div class="pt"><span>Receita planejada</span><b>${money(p.income)}</b></div><div class="pt" style="margin-top:14px"><span>Gastos planejados</span><b>${money(p.spend)}</b></div><div class="prog" style="margin-top:16px"><i style="width:${Math.min(100,q)}%"></i></div><div class="meta">${q.toFixed(0)}% distribuído · Economia planejada <b>${money(p.save)}</b></div></div><div class="copy" style="margin-top:10px"><div><b>Copiar mês anterior</b><span>Receita + limites das categorias</span></div><button class="secondary" onclick="copyPrev()">Copiar</button></div><div class="label">Realizado × limite</div><div class="section">${budgetRows()}</div><div class="label">Economia</div><div class="grid"><div class="card real"><span>Planejada</span><strong class="purple">${money(p.save)}</strong></div><div class="card real"><span>Real</span><strong class="${t.result>=0?"green":"red"}">${money(t.result)}</strong></div></div>`}
function accounts(){return`${header()}<div class="pagehead"><h1>Contas</h1><button class="primary" onclick="openAcc()">+ Adicionar</button></div><div class="section">${db.accounts.length?db.accounts.map(a=>`<div class="row"><div class="icon">▣</div><div class="main"><div class="name">${esc(a.name)}</div><div class="meta">${esc(a.type)}</div></div><div><div class="amount">${money(a.balance)}</div><div class="actions"><button class="secondary" onclick="openAcc('${a.id}')">Editar</button><button class="danger" onclick="delAcc('${a.id}')">Excluir</button></div></div></div>`).join(""):'<div class="empty">Nenhuma conta cadastrada.</div>'}</div>`}
function config(){return`${header()}<div class="pagehead"><h1>Ajustes</h1></div><div class="label">Categorias de despesas</div><div class="section">${cats("expense")}</div><div class="label">Categorias de receitas</div><div class="section">${cats("income")}</div><div class="label">Backup</div><div class="section"><div class="meta">Seus dados ficam no armazenamento local deste dispositivo.</div><div class="actions"><button class="secondary" onclick="exportData()">Exportar</button><label class="primary">Importar<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label></div></div>`}
function cats(type){let a=type==="expense"?db.categories:db.incomeCategories;return`<div style="text-align:right"><button class="secondary" onclick="addCat('${type}')">+ Nova</button></div>${a.map((c,i)=>`<div class="catrow"><div class="main">${esc(c)}</div><button class="secondary" onclick="renameCat('${type}',${i})">Editar</button><button class="danger" onclick="removeCat('${type}',${i})">Excluir</button></div>`).join("")}`}
function openModal(x){document.getElementById("modal").innerHTML=x;document.getElementById("mb").classList.add("show")}function closeModal(){document.getElementById("mb").classList.remove("show")}function toast(s){let e=document.getElementById("toast");e.textContent=s;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function openTx(id){editId=id||null;let t=id?db.transactions.find(x=>x.id===id):{type:"expense",date:new Date().toISOString().slice(0,10),amount:"",category:db.categories[0],description:"",account:db.accounts[0]?.name||"",method:db.methods[0]};openModal(`<div class="mhead"><h2>${id?"Editar lançamento":"Novo lançamento"}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Tipo</label><select id="tt" onchange="refreshCat()"><option value="expense" ${t.type==="expense"?"selected":""}>Despesa</option><option value="income" ${t.type==="income"?"selected":""}>Receita</option></select></div><div class="field"><label>Valor</label><input id="ta" type="number" step=".01" value="${t.amount||""}"></div><div class="field"><label>Data</label><input id="td" type="date" value="${t.date}"></div><div class="field"><label id="tl">${t.type==="income"?"Fonte da receita":"Categoria da despesa"}</label><select id="tc">${(t.type==="income"?db.incomeCategories:db.categories).map(c=>`<option ${c===t.category?"selected":""}>${esc(c)}</option>`).join("")}</select></div><div class="field"><label>Conta / cartão</label><select id="tac"><option value="">Sem conta</option>${db.accounts.map(a=>`<option ${a.name===t.account?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div><div class="field"><label>Forma de pagamento</label><select id="tm">${db.methods.map(x=>`<option ${x===t.method?"selected":""}>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>Descrição</label><input id="tds" value="${esc(t.description||"")}" placeholder="Ex.: mercado, salário..."></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveTx()">Salvar</button></div>`)}
function refreshCat(){let type=document.getElementById("tt").value,old=document.getElementById("tc").value,a=type==="income"?db.incomeCategories:db.categories;document.getElementById("tl").textContent=type==="income"?"Fonte da receita":"Categoria da despesa";document.getElementById("tc").innerHTML=a.map(c=>`<option ${c===old?"selected":""}>${esc(c)}</option>`).join("")}
function saveTx(){let type=tt.value,amount=Number(ta.value),date=td.value;if(amount<=0||!date){toast("Informe valor e data.");return}let t={id:editId||crypto.randomUUID(),type,amount,date,category:tc.value,account:tac.value,method:tm.value,description:tds.value.trim()};if(editId)db.transactions[db.transactions.findIndex(x=>x.id===editId)]=t;else db.transactions.push(t);save();closeModal();toast("Lançamento salvo");render()}
function delTx(id){if(!confirm("Excluir este lançamento?"))return;db.transactions=db.transactions.filter(x=>x.id!==id);save();render()}
function openBudget(){let p=plan(),m=ym();openModal(`<div class="mhead"><h2>Planejamento de ${esc(ml())}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Receita planejada</label><input id="bi" type="number" step=".01" value="${p.income||""}"></div>${db.categories.map(c=>`<div class="field"><label>${esc(c)}</label><input class="bc" data-c="${esc(c)}" type="number" step=".01" value="${db.budgets[m+"|"+c]||""}"></div>`).join("")}</div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveBudget()">Salvar</button></div>`)}
function saveBudget(){let m=ym();db.monthlyIncome[m]=Number(bi.value)||0;document.querySelectorAll(".bc").forEach(x=>db.budgets[m+"|"+x.dataset.c]=Number(x.value)||0);save();closeModal();toast("Planejamento salvo");render()}
function copyPrev(){let d=new Date(cur);d.setMonth(d.getMonth()-1);let pm=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),m=ym();if(!db.monthlyIncome[pm]&&!db.categories.some(c=>db.budgets[pm+"|"+c])){toast("O mês anterior não tem planejamento.");return}if(!confirm(`Copiar o planejamento de ${d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}?`))return;db.monthlyIncome[m]=Number(db.monthlyIncome[pm]||0);db.categories.forEach(c=>db.budgets[m+"|"+c]=Number(db.budgets[pm+"|"+c]||0));save();toast("Planejamento copiado");render()}
function openAcc(id){editAcc=id||null;let a=id?db.accounts.find(x=>x.id===id):{name:"",type:"Conta",balance:0};openModal(`<div class="mhead"><h2>${id?"Editar conta":"Nova conta"}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Nome</label><input id="an" value="${esc(a.name)}"></div><div class="field"><label>Tipo</label><select id="at"><option ${a.type==="Conta"?"selected":""}>Conta</option><option ${a.type==="Cartão"?"selected":""}>Cartão</option><option ${a.type==="Poupança"?"selected":""}>Poupança</option><option ${a.type==="Investimento"?"selected":""}>Investimento</option></select></div><div class="field"><label>Saldo / valor atual</label><input id="ab" type="number" step=".01" value="${Number(a.balance)||0}"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveAcc()">Salvar</button></div>`)}
function saveAcc(){let name=an.value.trim();if(!name){toast("Informe um nome.");return}if(editAcc){let a=db.accounts.find(x=>x.id===editAcc),old=a.name;a.name=name;a.type=at.value;a.balance=Number(ab.value)||0;db.transactions.forEach(t=>{if(t.account===old)t.account=name})}else db.accounts.push({id:crypto.randomUUID(),name,type:at.value,balance:Number(ab.value)||0});save();closeModal();render()}
function delAcc(id){let a=db.accounts.find(x=>x.id===id),used=db.transactions.some(t=>t.account===a.name);if(!confirm(used?`Excluir "${a.name}"? Os lançamentos não serão apagados, mas ficarão sem conta.`:`Excluir "${a.name}"?`))return;db.accounts=db.accounts.filter(x=>x.id!==id);if(used)db.transactions.forEach(t=>{if(t.account===a.name)t.account="Sem conta"});save();render()}
function addCat(type){let n=prompt("Nome da nova categoria:");if(!n)return;n=n.trim();let a=type==="expense"?db.categories:db.incomeCategories;if(!n||a.includes(n))return;a.push(n);save();render()}
function renameCat(type,i){let a=type==="expense"?db.categories:db.incomeCategories,n=prompt("Novo nome:",a[i]);if(!n)return;n=n.trim();if(!n||a.includes(n))return;let old=a[i];a[i]=n;db.transactions.forEach(t=>{if(t.category===old)t.category=n});save();render()}
function removeCat(type,i){let a=type==="expense"?db.categories:db.incomeCategories;if(a.length<2)return;let n=a[i];if(!confirm(`Excluir "${n}"?`))return;a.splice(i,1);save();render()}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="meu-budget-backup-"+ym()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.transactions))throw 0;db=x;db.categories ||= defaults.categories;db.incomeCategories ||= defaults.incomeCategories;db.accounts ||= [];save();render();toast("Backup importado")}catch(_){toast("Backup inválido")}};r.readAsText(f)}
function render(){let c=db.page==="dashboard"?dashboard():db.page==="transactions"?transactions():db.page==="budget"?budget():db.page==="accounts"?accounts():config();document.getElementById("app").innerHTML=`<main class="wrap">${c}</main>${nav()}`}
render();if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
